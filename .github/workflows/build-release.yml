name: Build and Publish Arch Repository

on:
  schedule:
    - cron: '15 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'packages.txt'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-repo
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  RELEASE_TAG: repository
  REPO_DB_NAME: nanoka

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Scan directories and generate matrix
        id: set-matrix
        run: |
          set -euo pipefail
          pkgs=()
          for dir in */ ; do
            dir="${dir%/}"
            case "$dir" in
              .github|cache|output) continue ;;
            esac
            if [[ -f "$dir/PKGBUILD" ]]; then
              pkgs+=("$dir")
            fi
          done

          MATRIX_JSON=$(printf '%s\n' "${pkgs[@]}" | jq -R . | jq -s -c .)
          echo "Found packages: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos-v3
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Install base dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git subversion mercurial sudo rsync github-cli fakeroot binutils pacman-contrib paru curl awk tar jq
          id builder >/dev/null 2>&1 || useradd -m builder
          grep -q '^builder ALL=(ALL) NOPASSWD: ALL$' /etc/sudoers || echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Configure makepkg for x86-64-v3 optimization
        run: |
          set -euo pipefail
          echo "Downloading CachyOS v3 makepkg.conf..."
          curl -sLo /etc/makepkg.conf https://raw.githubusercontent.com/CachyOS/docker-makepkg/refs/heads/master/docker-makepkg-v3/makepkg.conf
          echo "Downloading CachyOS v3 rust.conf..."
          mkdir -p /etc/makepkg.conf.d
          curl -sLo /etc/makepkg.conf.d/rust.conf https://raw.githubusercontent.com/CachyOS/docker-makepkg/refs/heads/master/docker-makepkg-v3/rust.conf
          sed -i 's/^PKGDEST=/#PKGDEST=/g' /etc/makepkg.conf
          sed -i 's/^LOGDEST=/#LOGDEST=/g' /etc/makepkg.conf
          sed -i 's/^PACKAGECARCH=/#PACKAGECARCH=/g' /etc/makepkg.conf

      - name: Configure pacman options and custom repository
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail
          tmp=$(mktemp)
          awk '
            BEGIN { inserted=0 }
            /^\[options\]$/ && !inserted { print; print "DisableSandboxNetwork"; inserted=1; next }
            { print }
            END { if (!inserted) exit 1 }
          ' /etc/pacman.conf > "$tmp"
          cat "$tmp" > /etc/pacman.conf
          rm -f "$tmp"

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | grep -qx "${REPO_DB_NAME}.db"; then
          {
            echo ""
            echo [$REPO_DB_NAME]
            echo SigLevel = Optional TrustAll
            echo "Server = https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          } >> /etc/pacman.conf
          fi
          pacman -Sy

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fix workspace ownership for build user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build, Cache and Fallback Logic
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ matrix.package }}
        run: |
          set -uo pipefail
          mkdir -p output /tmp/repo-files /tmp/repo-db

          echo "Fetching database metadata..."
          if gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --dir /tmp/repo-db --pattern "${REPO_DB_NAME}.files.tar.gz"; then
            if ! tar -xzf "/tmp/repo-db/${REPO_DB_NAME}.files.tar.gz" -C /tmp/repo-files; then
              echo "::warning::Cannot extract ${REPO_DB_NAME}.files.tar.gz; every package will be treated as needing a rebuild."
            fi
          else
            echo "::warning::No ${REPO_DB_NAME}.files.tar.gz asset in release '$RELEASE_TAG'; every package will be treated as needing a rebuild."
          fi

          echo "Checking status for $PKG"
          VCS_PREPASS_OK=true
          if grep -q 'pkgver()' "$PKG/PKGBUILD"; then
            if ! sudo -u builder bash -lc "cd '$GITHUB_WORKSPACE/$PKG' && makepkg -od --noprepare --skipinteg"; then
              echo "::warning::pkgver() pre-pass failed for $PKG; forcing a rebuild because the cached version cannot be trusted."
              VCS_PREPASS_OK=false
            fi
          fi

          EXPECTED_PKGS=""
          if ! EXPECTED_PKGS=$(sudo -u builder bash -lc "cd '$GITHUB_WORKSPACE/$PKG' && makepkg --packagelist"); then
            echo "::warning::makepkg --packagelist failed for $PKG; forcing a rebuild."
            EXPECTED_PKGS=""
          fi
          EXPECTED_PKGS="${EXPECTED_PKGS//:/.}"

          NEEDS_BUILD=false
          if [[ "$VCS_PREPASS_OK" != "true" || -z "$EXPECTED_PKGS" ]]; then
            NEEDS_BUILD=true
          else
            for pkg_path in $EXPECTED_PKGS; do
              pkg_basename=$(basename "$pkg_path")
              if ! grep -q -x "$pkg_basename" /tmp/repo-files/*/desc 2>/dev/null; then
                NEEDS_BUILD=true
                break
              fi
            done
          fi

          if [[ "$NEEDS_BUILD" == "false" ]]; then
            echo "Package $PKG is up to date. Fetching specific cache from release."
            for pkg_path in $EXPECTED_PKGS; do
              pkg_basename=$(basename "$pkg_path")
              if ! gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --dir output --pattern "$pkg_basename"; then
                echo "::warning::Failed to fetch $pkg_basename cache. Forcing rebuild."
                NEEDS_BUILD=true
                break
              fi
            done
          fi

          if [[ "$NEEDS_BUILD" == "false" ]]; then
            echo "$PKG" > output/status-skipped-$PKG.txt
          else
            echo "Building $PKG with paru"
            ASSUME_PKGS=$(sudo -u builder bash -lc "cd '$GITHUB_WORKSPACE/$PKG' && source PKGBUILD && echo \${pkgname[@]}")
            ASSUME_ARGS=""
            for subpkg in $ASSUME_PKGS; do
              ASSUME_ARGS="$ASSUME_ARGS --assume-installed $subpkg"
            done
            PARU_FLAGS="--noconfirm --skipreview --useask --removemake --nocheck -B$ASSUME_ARGS"
            if [[ "$PKG" == "pacman" ]]; then
              echo "Package is pacman: adding --skipinteg to makepkg arguments"
              PARU_FLAGS="$PARU_FLAGS --mflags --skipinteg"
            fi
            if ! sudo -u builder bash -lc "cd '$GITHUB_WORKSPACE/$PKG' && paru $PARU_FLAGS '$GITHUB_WORKSPACE/$PKG'"; then
              echo "::warning::paru exited non-zero for $PKG; checking whether package files were produced anyway."
            fi
            if ls "$PKG"/*.pkg.tar.zst >/dev/null 2>&1; then
              mv "$PKG"/*.pkg.tar.zst output/
              echo "Build OK: $PKG"
              echo "$PKG" > output/status-built-$PKG.txt
            else
              echo "Build failed for $PKG"
              echo "Triggering fallback mechanism for $PKG..."
              FALLBACK_CANDIDATES=()
              PROTECT_NAMES=()
              RESTORED_COUNT=0
              declare -A candidate_seen=()
              add_candidate() {
                [[ -n "$1" ]] || return 0
                [[ -n "${candidate_seen[$1]:-}" ]] && return 0
                candidate_seen["$1"]=1
                FALLBACK_CANDIDATES+=("$1")
              }

              if [[ -d /tmp/repo-files ]]; then
                for desc_file in /tmp/repo-files/*/desc; do
                  [[ -f "$desc_file" ]] || continue
                  base_pkg=$(awk '/^%BASE%/{getline; print; exit}' "$desc_file")
                  pkg_name=$(awk '/^%NAME%/{getline; print; exit}' "$desc_file")
                  check_name="${base_pkg:-$pkg_name}"
                  [[ "$check_name" == "$PKG" ]] || continue
                  add_candidate "$(awk '/^%FILENAME%/{getline; print; exit}' "$desc_file")"
                done
              fi

              RELEASE_ASSETS=""
              if RELEASE_ASSETS=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name'); then
                for pkg_name in $ASSUME_PKGS; do
                  while IFS= read -r asset; do
                    [[ "$asset" == "$pkg_name"-*.pkg.tar.zst ]] && add_candidate "$asset"
                  done <<< "$RELEASE_ASSETS"
                done
              else
                echo "::warning::Cannot list release assets while restoring $PKG; assets will be protected from deletion in this run."
                printf '*\n' > output/protect-all.txt
              fi
              if [[ -z "$ASSUME_PKGS" ]]; then
                echo "::warning::Cannot determine the package names of $PKG; assets will be protected from deletion in this run."
                printf '*\n' > output/protect-all.txt
              fi

              for file_name in "${FALLBACK_CANDIDATES[@]}"; do
                echo "Restoring $file_name from previous release"
                if gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --dir output --pattern "$file_name"; then
                  RESTORED_COUNT=$(( RESTORED_COUNT + 1 ))
                else
                  echo "::warning::Could not restore $file_name for $PKG; it will be kept in the release."
                  PROTECT_NAMES+=("$file_name")
                fi
              done

              if (( ${#PROTECT_NAMES[@]} > 0 )); then
                printf '%s\n' "${PROTECT_NAMES[@]}" > "output/protect-$PKG.txt"
              fi
              if (( RESTORED_COUNT > 0 )); then
                echo "Restored $RESTORED_COUNT file(s) of $PKG from the previous release"
                echo "$PKG" > "output/status-restored-$PKG.txt"
              else
                echo "Fallback failed for $PKG: no previous files found. Gracefully exiting to ignore package."
                echo "$PKG" > "output/status-failed-$PKG.txt"
              fi
              exit 0
            fi
          fi

          for f in output/*:* ; do
            if [[ -f "$f" ]]; then
              new_f="${f//:/.}"
              echo "Renaming $f to $new_f"
              mv "$f" "$new_f"
            fi
          done

          sudo -u builder rm -rf "$GITHUB_WORKSPACE/$PKG/src" "$GITHUB_WORKSPACE/$PKG/pkg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.package }}
          path: output/*
          if-no-files-found: ignore
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/archlinux/archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed github-cli pacman-contrib jq

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: output
          pattern: pkg-*
          merge-multiple: true

      - name: Generate fresh pacman database & Prepare Release Notes
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd output
          shopt -s nullglob
          pkgs=( *.pkg.tar.zst )

          if (( ${#pkgs[@]} == 0 )); then
            echo "No packages exist. Repository is empty. Halting."
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_packages=true" >> "$GITHUB_OUTPUT"

          status_built_files=( status-built-*.txt )
          status_skipped_files=( status-skipped-*.txt )
          status_restored_files=( status-restored-*.txt )
          status_failed_files=( status-failed-*.txt )
          protect_files=( protect-*.txt )
          BUILT=""
          SKIPPED=""
          RESTORED=""
          FAILED=""
          if (( ${#status_built_files[@]} > 0 )); then BUILT=$(cat "${status_built_files[@]}"); fi
          if (( ${#status_skipped_files[@]} > 0 )); then SKIPPED=$(cat "${status_skipped_files[@]}"); fi
          if (( ${#status_restored_files[@]} > 0 )); then RESTORED=$(cat "${status_restored_files[@]}"); fi
          if (( ${#status_failed_files[@]} > 0 )); then FAILED=$(cat "${status_failed_files[@]}"); fi

          declare -A PROTECTED=()
          if (( ${#protect_files[@]} > 0 )); then
            while IFS= read -r protected_name; do
              [[ -n "$protected_name" ]] && PROTECTED["$protected_name"]=1
            done < <(cat "${protect_files[@]}")
          fi
          rm -f status-*.txt protect-*.txt

          if [[ -z "$BUILT" ]]; then
            echo "has_new_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_new_changes=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Generating clean database from active packages only."
          repo-add "${REPO_DB_NAME}.db.tar.gz" "${pkgs[@]}"

          # Drift: asset .pkg.tar.zst trên Release phải khớp đúng tập file trong output/.
          compute_repo_drift() {
            local -A have=() rel=()
            local name asset
            STALE_ASSETS=()
            MISSING_ASSETS=()
            for name in "$@"; do
              have["$name"]=1
            done
            while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              [[ "$asset" == *.pkg.tar.zst ]] || continue
              rel["$asset"]=1
              if [[ -z "${have[$asset]:-}" ]]; then
                STALE_ASSETS+=("$asset")
              fi
            done
            for name in "$@"; do
              if [[ -z "${rel[$name]:-}" ]]; then
                MISSING_ASSETS+=("$name")
              fi
            done
            REPO_DRIFT=false
            if (( ${#STALE_ASSETS[@]} > 0 || ${#MISSING_ASSETS[@]} > 0 )); then
              REPO_DRIFT=true
            fi
          }

          release_assets=""
          if release_assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null); then
            compute_repo_drift "${pkgs[@]}" <<< "$release_assets"
          else
            echo "::warning::Release '$RELEASE_TAG' cannot be read; forcing a publish so it is created or repaired."
            REPO_DRIFT=true
            STALE_ASSETS=()
            MISSING_ASSETS=()
          fi

          if (( ${#PROTECTED[@]} > 0 )); then
            kept_protected=()
            deletable=()
            for asset in "${STALE_ASSETS[@]}"; do
              if [[ -n "${PROTECTED[$asset]:-}" || -n "${PROTECTED["*"]:-}" ]]; then
                kept_protected+=("$asset")
              else
                deletable+=("$asset")
              fi
            done
            STALE_ASSETS=("${deletable[@]}")
            if (( ${#kept_protected[@]} > 0 )); then
              echo "Keeping assets of packages whose build failed: ${kept_protected[*]}"
            fi
            REPO_DRIFT=false
            if (( ${#STALE_ASSETS[@]} > 0 || ${#MISSING_ASSETS[@]} > 0 )); then
              REPO_DRIFT=true
            fi
          fi

          echo "drift=$REPO_DRIFT stale=${#STALE_ASSETS[@]} missing=${#MISSING_ASSETS[@]}"
          if (( ${#MISSING_ASSETS[@]} > 0 )); then
            echo "Not in the release yet (will be uploaded): ${MISSING_ASSETS[*]}"
          fi
          if (( ${#STALE_ASSETS[@]} > 0 )); then
            echo "Assets to delete (no longer part of the repository): ${STALE_ASSETS[*]}"
          fi
          echo "has_drift=$REPO_DRIFT" >> "$GITHUB_OUTPUT"
          {
            echo "STALE_ASSETS<<EOF"
            if (( ${#STALE_ASSETS[@]} > 0 )); then
              printf '%s\n' "${STALE_ASSETS[@]}"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

          FORMATTED_BUILT=$(echo "$BUILT" | sed '/^$/d' | sed 's/^/- 🟢 /')
          FORMATTED_SKIPPED=$(echo "$SKIPPED" | sed '/^$/d' | sed 's/^/- 🟡 /')
          FORMATTED_RESTORED=$(echo "$RESTORED" | sed '/^$/d' | sed 's/^/- 🟠 /' | sed 's/$/ (kept previous build, current build failed)/')
          FORMATTED_FAILED=$(echo "$FAILED" | sed '/^$/d' | sed 's/^/- 🔴 /' | sed 's/$/ (dropped: build failed and nothing to restore)/')

          [[ -z "$FORMATTED_BUILT" ]] && FORMATTED_BUILT="- None"
          [[ -z "$FORMATTED_SKIPPED" ]] && FORMATTED_SKIPPED="- None"
          [[ -z "$FORMATTED_RESTORED" ]] && FORMATTED_RESTORED="- None"
          [[ -z "$FORMATTED_FAILED" ]] && FORMATTED_FAILED="- None"

          {
            echo "BUILT_LOG<<EOF"
            echo "$FORMATTED_BUILT"
            echo "EOF"
            echo "SKIPPED_LOG<<EOF"
            echo "$FORMATTED_SKIPPED"
            echo "EOF"
            echo "RESTORED_LOG<<EOF"
            echo "$FORMATTED_RESTORED"
            echo "EOF"
            echo "FAILED_LOG<<EOF"
            echo "$FORMATTED_FAILED"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish to GitHub Release
        if: ${{ steps.generate.outputs.has_packages == 'true' && (steps.generate.outputs.has_new_changes == 'true' || steps.generate.outputs.has_drift == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          REPO="${{ github.repository }}"
          TAG="${{ env.RELEASE_TAG }}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading refreshed assets."
          else
            echo "Creating release $TAG."
            gh release create "$TAG" --repo "$REPO" \
              --title "Arch Package Repository" \
              --notes "Auto-built pacman repository."
          fi

          pkg_assets=( output/*.pkg.tar.zst )
          if (( ${#pkg_assets[@]} == 0 )); then
            echo "::error::No package files in output/; refusing to publish."
            exit 1
          fi
          echo "Uploading package files: ${#pkg_assets[@]} file(s)."
          gh release upload "$TAG" "${pkg_assets[@]}" --repo "$REPO" --clobber

          db_assets=( output/"${REPO_DB_NAME}".db* output/"${REPO_DB_NAME}".files* )
          if (( ${#db_assets[@]} == 0 )); then
            echo "::error::No pacman database files in output/; refusing to publish a repository without a database."
            exit 1
          fi
          echo "Uploading pacman databases: ${db_assets[*]}"
          gh release upload "$TAG" "${db_assets[@]}" --repo "$REPO" --clobber

          if [[ -n "${STALE_ASSETS:-}" ]]; then
            echo "Deleting assets that are no longer part of the repository:"
            while IFS= read -r stale; do
              [[ -n "$stale" ]] || continue
              echo "  - $stale"
              if ! gh release delete-asset "$TAG" "$stale" --repo "$REPO" -y; then
                echo "::error::Cannot delete stale asset $stale; the next run will retry."
                exit 1
              fi
            done <<< "$STALE_ASSETS"
          else
            echo "No stale assets to delete."
          fi

          RELEASE_NOTES=$(cat <<EOF
          ### 📦 Repository Update Summary (Matrix Build)

          **Last Updated:** $(date -u '+%Y-%m-%d %H:%M UTC')

          #### 🟢 Newly Built Packages
          ${{ env.BUILT_LOG }}

          #### 🟡 Cached / Skipped Packages
          ${{ env.SKIPPED_LOG }}

          #### 🟠 Kept Previous Build (build failed, previous version reused)
          ${{ env.RESTORED_LOG }}

          #### 🔴 Failed Packages
          ${{ env.FAILED_LOG }}

          ---
          *Automated Scatter-Gather build by GitHub Actions.*
          EOF
          )

          gh release edit "$TAG" --repo "$REPO" --notes "$RELEASE_NOTES"
